version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8080:8080"
    restart: on-failure
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NASA_API_KEY=${NASA_API_KEY:-DEMO_KEY}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/marsdb
      - SPRING_DATASOURCE_USERNAME=mars
      - SPRING_DATASOURCE_PASSWORD=marspass
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=mars
      - SPRING_RABBITMQ_PASSWORD=marspass
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mars-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mars-network

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5422:5432"
    environment:
      - POSTGRES_USER=mars
      - POSTGRES_PASSWORD=marspass
      - POSTGRES_DB=marsdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars -d marsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mars-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - mars-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - mars-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=mars
      - RABBITMQ_DEFAULT_PASS=marspass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - mars-network

networks:
  mars-network:
    driver: bridge
