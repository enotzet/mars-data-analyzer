spring.application.name=MarsDataAnalyzer

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.embedding.options.model=text-embedding-3-small

# NASA
nasa.api.key=${NASA_API_KEY:DEMO_KEY}

# PostgreSQL / JPA
spring.datasource.url=jdbc:postgresql://postgres:5432/marsdb
spring.datasource.username=mars
spring.datasource.password=marspass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true

# Elasticsearch
spring.elasticsearch.uris=http://elasticsearch:9200

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=mars
spring.rabbitmq.password=marspass

# Async
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
